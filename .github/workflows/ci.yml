name: CI — build + breathtaking gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build
      - name: Every screen ships breathtaking — prove it
        run: |
          test -f src/app/page.tsx || exit 1
          test -f src/app/admin/page.tsx || exit 1
          ! grep -q '<select' src/app/page.tsx || (echo 'No default <select> — use shadcn/themed' && exit 1)
          echo "Awwwards floor: 1440px screenshots required in PR (gallery + admin + login if touched)."
