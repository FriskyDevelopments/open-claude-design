name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please never paste API keys or other secrets here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /canvas?kind=slides
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Web app / gallery, Canvas, BYOK / /api/chat, MCP (stdio), MCP (HTTP / Worker), Deploy (Cloudflare), Deploy (Netlify), Docs, Other]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Browser + OS, or MCP client + version, Node version
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text
